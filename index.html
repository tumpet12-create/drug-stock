<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบสต็อกยา</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d9488">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-16">

  <!-- Header -->
  <header class="bg-teal-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <h1 class="text-lg font-bold">ระบบตรวจยาใกล้หมดอายุ</h1>
    <div id="userDisplay" class="text-sm"></div>
  </header>

  <!-- Login Section -->
  <section id="loginSection" class="p-6 max-w-md mx-auto mt-10 bg-white rounded-xl shadow-md">
    <h2 class="text-xl font-bold mb-4 text-center">เข้าสู่ระบบ</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="username" class="w-full border rounded-lg p-2.5">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">รหัสผ่าน (Password)</label>
        <input type="password" id="password" class="w-full border rounded-lg p-2.5">
      </div>
      <button onclick="handleLogin()" class="w-full bg-teal-600 text-white py-2.5 rounded-lg font-semibold hover:bg-teal-700">เข้าสู่ระบบ</button>
    </div>
  </section>

  <!-- Main App Section (ซ่อนไว้ก่อน Login) -->
  <main id="appSection" class="hidden p-4 max-w-2xl mx-auto space-y-6">
    
    <!-- ตรวจสอบรอบเวลาตรวจ -->
    <div id="auditWindowBanner" class="p-3 rounded-lg text-sm font-medium"></div>

    <!-- เลือกตู้ยา -->
    <div class="bg-white p-4 rounded-xl shadow-sm border">
      <label class="block text-sm font-semibold mb-2">เลือกตู้ยาที่ต้องการตรวจสอบ:</label>
      <select id="cabinetSelect" onchange="loadCabinetItems()" class="w-full border rounded-lg p-2.5 bg-slate-50">
        <option value="">-- กรุณาเลือกตู้ยา --</option>
      </select>
    </div>

    <!-- รายการยาในตู้ -->
    <div id="itemsContainer" class="space-y-4"></div>

    <!-- ปุ่มส่งข้อมูล -->
    <button id="submitBtn" onclick="submitAudit()" class="hidden w-full bg-teal-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-teal-700">
      บันทึกผลการตรวจสอบประจำเดือน
    </button>
  </main>

  <script>
    // ** นำ Web App URL ที่ได้จาก Google Apps Script มาใส่ตรงนี้ **
    const API_URL = "https://script.google.com/macros/s/AKfycbxqCQEGBd22SXNZ79A6SPG2rNpL62YtzSf_WcjQivX2ZxXeip6zMQiwS0l3XFyNf7HZ/exec";

    let db = { users: [], cabinets: [], items: [] };
    let currentUser = null;

    // ลงทะเบียน Service Worker สำหรับ PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // โหลดข้อมูลเริ่มต้นจาก Google Sheets
    async function init() {
      try {
        const res = await fetch(`${API_URL}?action=getInitialData`);
        db = await res.json();
      } catch (err) {
        console.error("Failed to load initial data", err);
      }
    }
    init();

    function handleLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const user = db.users.find(x => x.username === u && String(x.password) === p);

      if (user) {
        currentUser = user;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('userDisplay').textContent = `${user.name} (${user.role})`;
        setupCabinetDropdown();
        checkAuditWindow();
      } else {
        alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      }
    }

    function checkAuditWindow() {
      const today = new Date();
      const day = today.getDate();
      const banner = document.getElementById('auditWindowBanner');
      
      // ตรวจสอบวันที่ 25 ของเดือนก่อน ถึงวันที่ 5 ของเดือนปัจจุบัน
      const isOnTime = (day >= 25 || day <= 5);
      if (isOnTime) {
        banner.className = "bg-green-100 text-green-800 p-3 rounded-lg border border-green-200 text-sm";
        banner.innerHTML = "✅ อยู่ในช่วงเวลาการตรวจปกติ (25 - 5 ของเดือน)";
      } else {
        banner.className = "bg-amber-100 text-amber-800 p-3 rounded-lg border border-amber-200 text-sm";
        banner.innerHTML = "⚠️ นอกช่วงเวลาปกติ (ระบบจะบันทึกสถานะ: ส่งล่าช้า)";
      }
    }

    function setupCabinetDropdown() {
      const select = document.getElementById('cabinetSelect');
      select.innerHTML = '<option value="">-- กรุณาเลือกตู้ยา --</option>';
      
      let allowedCabinets = db.cabinets;
      if (currentUser.role === 'Officer' && currentUser.assigned_cabinets !== 'ALL') {
        const allowedIds = currentUser.assigned_cabinets.split(',').map(s => s.trim());
        allowedCabinets = db.cabinets.filter(c => allowedIds.includes(c.cabinet_id));
      }

      allowedCabinets.forEach(cab => {
        const opt = document.createElement('option');
        opt.value = cab.cabinet_id;
        opt.textContent = `${cab.cabinet_name} (${cab.location})`;
        select.appendChild(opt);
      });
    }

    function loadCabinetItems() {
      const cabId = document.getElementById('cabinetSelect').value;
      const container = document.getElementById('itemsContainer');
      const submitBtn = document.getElementById('submitBtn');
      container.innerHTML = '';

      if (!cabId) {
        submitBtn.classList.add('hidden');
        return;
      }

      const items = db.items.filter(i => i.cabinet_id === cabId);
      if (items.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400">ไม่พบรายการยาในตู้นี้</p>';
        submitBtn.classList.add('hidden');
        return;
      }

      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow-sm border space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-slate-800">${item.drug_name}</h3>
              <p class="text-xs text-slate-500">Fixed Stock: ${item.fixed_stock} ${item.unit}</p>
            </div>
            <span class="text-xs bg-slate-100 px-2 py-1 rounded">#${index + 1}</span>
          </div>

          <div class="pt-2 border-t space-y-2">
            <label class="text-xs font-semibold text-slate-600 block">สถานะวันหมดอายุ:</label>
            <select class="w-full border rounded p-2 text-sm exp-status" onchange="toggleExpInputs(this, '${item.item_id}')">
              <option value="NORMAL">> 6 เดือนขึ้นไป (ปกติ ไม่ต้องระบุวัน)</option>
              <option value="NEAR_EXP">ยาจะหมดอายุภายใน 6 เดือน</option>
            </select>
          </div>

          <!-- กล่องกรอกรายละเอียดเมื่อยาใกล้หมดอายุ -->
          <div id="expDetail_${item.item_id}" class="hidden bg-amber-50 p-3 rounded-lg border border-amber-200 space-y-3 text-sm">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-xs font-medium">Lot No.</label>
                <input type="text" class="w-full border rounded p-1.5 lot-input bg-white">
              </div>
              <div>
                <label class="text-xs font-medium">วันหมดอายุ (Exp Date)</label>
                <input type="date" class="w-full border rounded p-1.5 exp-date-input bg-white">
              </div>
            </div>
            <div>
              <label class="text-xs font-medium">จำนวนที่ใกล้หมดอายุ (${item.unit})</label>
              <input type="number" class="w-full border rounded p-1.5 qty-input bg-white">
            </div>
            <div>
              <label class="text-xs font-medium">สาเหตุที่ยาใกล้หมดอายุ</label>
              <input type="text" placeholder="เช่น อัตราการใช้น้อย, ได้รับยาล็อตสั้นมา" class="w-full border rounded p-1.5 cause-input bg-white">
            </div>
            <div>
              <label class="text-xs font-medium">แนวทางการจัดการ</label>
              <select class="w-full border rounded p-1.5 action-select bg-white">
                <option value="ฝากห้องยาอื่นใช้">ฝากห้องยาอื่นใช้</option>
                <option value="ทำลาย">ทำลาย</option>
                <option value="รอดูก่อน">รอดูก่อน</option>
                <option value="ส่งคืนสต็อก">ส่งคืนสต็อก</option>
              </select>
            </div>
            <div>
              <label class="text-xs font-medium">รายละเอียดการจัดการ (เช่น ระบุห้องยา/กำหนดวันส่งคืน/เหตุผล)</label>
              <input type="text" class="w-full border rounded p-1.5 action-detail-input bg-white">
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      submitBtn.classList.remove('hidden');
    }

    function toggleExpInputs(selectEl, itemId) {
      const detailBox = document.getElementById(`expDetail_${itemId}`);
      if (selectEl.value === 'NEAR_EXP') {
        detailBox.classList.remove('hidden');
      } else {
        detailBox.classList.add('hidden');
      }
    }

    async function submitAudit() {
      const cabId = document.getElementById('cabinetSelect').value;
      const cards = document.querySelectorAll('#itemsContainer > div');
      const now = new Date();
      const auditCycle = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const day = now.getDate();
      const statusOnTime = (day >= 25 || day <= 5) ? 'On-Time' : 'Late';

      let records = [];

      cards.forEach(card => {
        const drugName = card.querySelector('h3').textContent;
        const status = card.querySelector('.exp-status').value;

        if (status === 'NEAR_EXP') {
          records.push({
            audit_id: 'AUD_' + Date.now(),
            audit_cycle: auditCycle,
            cabinet_id: cabId,
            drug_name: drugName,
            fixed_stock: '',
            lot_no: card.querySelector('.lot-input').value,
            exp_date: card.querySelector('.exp-date-input').value,
            qty: card.querySelector('.qty-input').value,
            cause: card.querySelector('.cause-input').value,
            action_plan: card.querySelector('.action-select').value,
            action_detail: card.querySelector('.action-detail-input').value,
            auditor_name: currentUser.name,
            status_ontime: statusOnTime
          });
        }
      });

      if (records.length === 0) {
        alert('ทุกรายการมีอายุมากกว่า 6 เดือน (ปกติ)');
      }

      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveAudit', records: records })
      });

      alert('บันทึกข้อมูลเรียบร้อยแล้ว');
      location.reload();
    }
  </script>
</body>
</html>
